<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>程式畫的簡報背景</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  .t{position:fixed;left:5%;top:11%;width:44%;color:#fff;pointer-events:none;
     font:700 clamp(22px,3.4vw,54px)/1.25 "Noto Serif TC","PingFang TC",serif;
     letter-spacing:.03em;text-shadow:0 2px 30px rgba(0,0,0,.5)}
  .t small{display:block;margin-top:.5em;font:400 clamp(11px,1.3vw,20px)/1.6 "Noto Sans TC",sans-serif;
     letter-spacing:.14em;opacity:.82}
  .t[hidden]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t" id="title">揚帆起航　攜手並進<small>2026 年度總結報告</small></div>
<script>
// 同一套配方，改用一支 fragment shader 畫：暗場留白佔多數，單一暖色發光核心當視覺中心。
// 純 WebGL，沒有引用任何函式庫。網址加 ?bare 可以收掉標題，方便截圖丟去量測。
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2rem">這個瀏覽器沒有 WebGL</p>'; }

const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;

// 便宜的 value noise，夠做星雲的絮狀感就好
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.02; a *= 0.5; }
  return v;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;

  // 發光核心刻意放右下，把左上整片留給標題
  vec2 core = vec2(0.42, -0.20);
  vec2 d = uv - core;

  float r = length(d);

  // 螺旋扭曲加緩慢自轉，讓絮狀結構繞著核心捲進去
  float a = uTime * 0.045 + 1.9 / (r + 0.35);
  mat2 rot = mat2(cos(a), -sin(a), sin(a), cos(a));
  float n = fbm(rot * d * 3.6 + 4.0);

  float glow = exp(-r * 6.2);                            // 主光暈，收緊
  float arms = smoothstep(0.42, 0.86, n) * exp(-r * 1.6); // 旋臂

  vec3 warm = vec3(1.00, 0.74, 0.36);          // 暖金色主光源
  vec3 cool = vec3(0.16, 0.28, 0.52);          // 冷藍環境
  vec3 col  = vec3(0.012, 0.020, 0.038);       // 深藍到黑的留白底

  col += cool * arms * 1.25;
  col += warm * arms * smoothstep(0.9, 0.15, r) * 0.75;   // 靠近核心的旋臂偏暖
  col += warm * glow * 0.55;
  col += warm * pow(glow, 3.0) * 0.8;                     // 核心過曝，收斂

  // 稀疏星點，只出現在暗處
  float star = step(0.9975, hash(floor(gl_FragCoord.xy * 0.65)));
  col += vec3(star) * 0.5 * (1.0 - glow);

  // 邊角壓暗，把注意力收回中間
  float vig = smoothstep(1.35, 0.25, length(uv));
  col *= mix(0.55, 1.0, vig);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize);
resize();

if (new URLSearchParams(location.search).has('bare')) {
  document.getElementById('title').hidden = true;
}

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0 = performance.now();
(function frame(now){
  gl.uniform2f(uRes, cv.width, cv.height);
  gl.uniform1f(uTime, still ? 0 : (now - t0) / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
})(t0);
</script>
</body>
</html>
